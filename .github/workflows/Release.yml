name: Build armeabi-v7a APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'

      # A temporary, per-run signing key. Do not use for long-term updates.
      - name: Generate temporary signing keystore
        shell: bash
        run: |
          mkdir -p keystore
          keytool -genkeypair -noprompt \
            -keystore keystore/ci-test.p12 -storetype PKCS12 \
            -storepass android123 -keypass android123 \
            -alias smsforwarder-ci -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=SmsForwarder Test, OU=CI, O=Personal Build, C=US"
          printf '%s\n' \
            'storeFile=../keystore/ci-test.p12' \
            'storePassword=android123' \
            'keyAlias=smsforwarder-ci' \
            'keyPassword=android123' \
            > keystore/keystore.properties

      - name: Build release APK
        run: bash ./gradlew assembleRelease

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-armeabi-v7a
          path: app/build/outputs/apk/release/*_armeabi-v7a_release.apk
          if-no-files-found: error
